<body>
  <a href="../index.html" class="back-link">← 返回風味圖鑑首頁</a>
  <div class="article-box">
    <span class="origin">NESPRESSO · 義式濃縮膠囊</span>
    <h1>Arpeggio 紫羅蘭濃縮</h1>
    <p>精選中南美洲阿拉比卡豆進行深度烘焙，展現出濃郁的烘烤可可香氣與絲絨般醇厚口感，頂層覆蓋著綿密細緻的咖啡油沫（Crema）。</p>

    <table>
      <tr><th>烘焙程度</th><td>深度烘焙 (Dark Roast)</td></tr>
      <tr><th>萃取強度</th><td>強度 9 / 13</td></tr>
      <tr><th>風味關鍵字</th><td>烘烤可可、麥芽香氣、綿密 Crema</td></tr>
      <tr><th>明亮酸度</th><td>★★☆☆☆ (2/5)</td></tr>
      <tr><th>醇厚度</th><td>★★★★☆ (4/5)</td></tr>
    </table>

    <div class="brew-box">
      <h3>☕ 推薦沖煮與特調建議</h3>
      <p>建議萃取為 <strong>40ml Espresso（義式濃縮）</strong>。加入 <strong>120ml 綿密熱奶泡</strong>製成拿鐵時，可可焦糖香氣會更加圓潤甜美！</p>
    </div>
  </div>
