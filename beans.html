  <div class="article-box">
    <span class="origin">ETHIOPIA · YIRGACHEFFE</span>
    <h1>衣索比亞 耶加雪菲 G1</h1>
    <p>來自衣索比亞高海拔產區的經典水洗豆，以優雅的白花香氣與明亮柑橘酸甜聞名，適合喜愛清爽茶感與果香層次的咖啡愛好者。</p>

    <table>
      <tr><th>烘焙程度</th><td>淺烘焙 (Light Roast)</td></tr>
      <tr><th>處理法</th><td>水洗處理 (Washed)</td></tr>
      <tr><th>風味關鍵字</th><td>茉莉花香、檸檬柑橘、蜂蜜尾韻</td></tr>
      <tr><th>明亮酸度</th><td>★★★★☆ (4/5)</td></tr>
      <tr><th>醇厚度</th><td>★★☆☆☆ (2/5)</td></tr>
    </table>

    <div class="brew-box">
      <h3>☕ 推薦沖煮與品飲建議</h3>
      <p>建議使用 V60 濾杯手沖，粉水比 <strong>1:15</strong>（15g 咖啡粉搭配 225ml 熱水），水溫 <strong>91°C</strong>。冰鎮後製成「西西里檸檬氣泡冰咖啡」也極具層次感！</p>
    </div>
